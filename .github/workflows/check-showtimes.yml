name: Check Showtimes

on:
  schedule:
    # Four times each hour, off the full hour. GitHub starts runs at the full
    # hour late or skips them under load.
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SHOWTIMES_URL: ${{ vars.SHOWTIMES_URL }}
      NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # The key never exists, so the restore falls back to the prefix and
      # loads the most recent state saved by the step below.
      - name: Restore cached state
        id: cache-json
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: showtimes-state-${{ github.run_id }}
          restore-keys: |
            showtimes-state-

      - name: Run script
        run: go run main.go

      - name: Save updated JSON state
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: showtimes-state-${{ github.run_id }}

      # Send one alert for each break: only when the previous completed run
      # passed. The current run is still in progress, so the list skips it.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check-showtimes.yml \
            --status completed --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$previous" = "success" ]; then
            curl -fsS -H "Title: Showtime check failed" -H "Priority: 4" -H "Tags: warning" \
              -H "Click: $RUN_URL" -d "The showtime check failed. Open the run log: $RUN_URL" \
              "https://ntfy.sh/$NTFY_TOPIC"
          fi
